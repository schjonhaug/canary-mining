[package]
name = "pool_sv2"
version = "0.3.0"
authors = ["The Stratum V2 Developers"]
edition = "2021"
description = "SV2 pool role"
documentation = "https://docs.rs/pool_sv2"
readme = "README.md"
homepage = "https://stratumprotocol.org"
repository = "https://github.com/stratum-mining/stratum"
license = "MIT OR Apache-2.0"
keywords = ["stratum", "mining", "bitcoin", "protocol"]


[lib]
name = "pool_sv2"
path = "src/lib/mod.rs"

[dependencies]
stratum-apps = { git = "https://github.com/stratum-mining/sv2-apps.git", rev = "de60df95245a4a6127cb5ece120d58433cbe823b", version = "0.4.0", features = ["pool"] }
async-channel = "1.5.1"
serde = { version = "1.0.89", features = ["derive", "alloc"], default-features = false }
tokio = { version = "1.44.1", features = ["full"] }
ext-config = { version = "0.14.0", features = ["toml"], package = "config" }
tracing = { version = "0.1" }
clap = { version = "4.5.39", features = ["derive"] }
bitcoin_core_sv2 = { git = "https://github.com/stratum-mining/sv2-apps.git", rev = "de60df95245a4a6127cb5ece120d58433cbe823b", version = "0.2.0" }
jd_server_sv2 = { git = "https://github.com/stratum-mining/sv2-apps.git", rev = "de60df95245a4a6127cb5ece120d58433cbe823b", version = "0.2.0" }
hex = "0.4.3"
hotpath = "0.14.0"

[features]
default = ["monitoring"]
monitoring = ["stratum-apps/monitoring"]
hotpath = ["hotpath/hotpath", "jd_server_sv2/hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc", "jd_server_sv2/hotpath-alloc"]

[patch."https://github.com/stratum-mining/sv2-apps.git"]
bitcoin_core_sv2 = { path = "../bitcoin-core-sv2" }
